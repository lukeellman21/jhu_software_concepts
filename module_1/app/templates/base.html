<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="logo">
            <h2>Portfolio</h2>
        </div>
        <nav class="navbar">
            <a href="{{ url_for('main.home') }}" class="nav-item {% if active_page == 'home' %}active{% endif %}">Home</a>
            <a href="{{ url_for('main.projects') }}" class="nav-item {% if active_page == 'projects' %}active{% endif %}">Projects</a>
            <a href="{{ url_for('main.contact') }}" class="nav-item {% if active_page == 'contact' %}active{% endif %}">Contact</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
